name: Backend CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pytest and mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        run: python -m pytest

      - name: Check types
        working-directory: backend
        run: python -m mypy app

  image:
    name: Backend image and rclone
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag s3-backpack-backend:ci backend

      - name: Verify rclone
        run: >-
          docker run --rm --entrypoint rclone
          s3-backpack-backend:ci version
