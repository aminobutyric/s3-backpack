name: Backend Tests

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        run: python -m pytest

      - name: Check types
        working-directory: backend
        run: python -m mypy app
