<section class="panel crate" id="panel-browse" data-panel="browse">
  <div class="panel-controls">
    <input id="prefix-filter" type="text" placeholder="filter by prefix\u2026" autocomplete="off" spellcheck="false" />
    <button id="refresh-objects" class="btn-ghost" type="button">Refresh</button>
  </div>

  <table class="objects-table">
    <thead>
      <tr>
        <th>Key</th>
        <th>Size</th>
        <th>Last modified</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="objects-body">
      <tr class="row-empty">
        <td colspan="4">Set an API key above to load objects.</td>
      </tr>
    </tbody>
  </table>
</section>
