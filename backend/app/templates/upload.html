<section class="panel crate" id="panel-upload" data-panel="upload" hidden>
  <div class="dropzone" id="dropzone">
    <p class="dropzone-label">Drop files here, or</p>
    <label class="btn-primary" for="file-input">Choose files</label>
    <input id="file-input" type="file" multiple hidden />
  </div>

  <div class="field-row">
    <label for="key-override">Key override</label>
    <input id="key-override" type="text" placeholder="only applies to a single file" autocomplete="off" spellcheck="false" />
  </div>

  <ul class="upload-list" id="upload-list"></ul>
</section>
