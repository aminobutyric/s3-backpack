[project]
name = "s3-gateway-backend"
version = "0.1.0"
description = "Backend service for the self-hosted S3 gateway (v1: Garage backend, compression, auth)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<0.116",
    "uvicorn[standard]>=0.29,<0.35",
    "boto3>=1.34,<2",
    "anyio>=4.4,<4.10",
    "pydantic-settings>=2.2,<3",
    "python-multipart>=0.0.9,<0.1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
